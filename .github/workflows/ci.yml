name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

env:
  NODE_VERSION: '26.13.0'
  NUB_VERSION: '0.9.7'

jobs:
  quality:
    name: Quality checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: hosmelq/.github/.github/actions/php-setup@32f4a95b53649f1634b195193a61bb56a6b26d50 # main
        with:
          php-tools: cs2pr
          php-version: '8.4'
        env:
          fail-fast: true

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check composer
        run: composer normalize --dry-run

      - name: Check code quality
        run: vendor/bin/rector --ansi --dry-run

      - name: Check code style
        run: composer ecs:check

      - name: Check static code
        run: composer phpstan

      - name: Check unused composer dependencies
        run: vendor/bin/composer-dependency-analyser

  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dependencies: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
          - dependencies: prefer-lowest
            laravel: 12.*
            php: '8.4'
            testbench: 10.*
        laravel: ['12.*', '13.*']
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: hosmelq/.github/.github/actions/php-setup@32f4a95b53649f1634b195193a61bb56a6b26d50 # main
        with:
          php-tools: cs2pr
          php-version: ${{ matrix.php }}
        env:
          fail-fast: true

      - name: Install composer dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: |
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$TESTBENCH" --no-interaction --no-update
          composer update --no-interaction --no-progress --prefer-dist --prefer-stable --"$DEPENDENCIES"

      - name: Installed dependencies
        run: composer show -D

      - name: Set up problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run tests
        run: composer test

  frontend:
    name: Frontend assets

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install frontend dependencies
        uses: hosmelq/.github/.github/actions/npm-install@32f4a95b53649f1634b195193a61bb56a6b26d50 # main
        with:
          node-version: ${{ env.NODE_VERSION }}
          nub-version: ${{ env.NUB_VERSION }}

      - name: Check frontend code
        run: nub run lint

      - name: Check frontend formatting
        run: nub run fmt:check

      - name: Build frontend assets
        run: nub run build

      - name: Check committed assets
        run: |
          git add --intent-to-add resources/dist
          git diff --exit-code --stat -- resources/dist
